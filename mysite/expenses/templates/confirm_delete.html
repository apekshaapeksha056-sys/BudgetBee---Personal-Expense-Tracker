{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm Delete — BudgetBee</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0f1117;
  --sidebar:#151820;
  --card:#1a1e2a;
  --border:#252a3a;
  --text:#e8eaf0;
  --muted:#6b7280;
  --danger:#f87171;
  --danger-dim:rgba(248,113,113,0.12);
  --input:#12151f;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  position:fixed;
  top:0;left:0;bottom:0;
  padding:24px 0;
}

.logo{
  padding:0 20px 24px;
  font-weight:600;
}

.nav-link{
  display:block;
  padding:10px 16px;
  color:var(--muted);
  text-decoration:none;
  font-size:14px;
}
.nav-link:hover{color:var(--text);background:var(--card)}

/* MAIN */
.main{
  margin-left:220px;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}

/* CARD */
.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:28px;
  text-align:center;
}

/* ICON */
.icon{
  font-size:48px;
  margin-bottom:12px;
}

/* TITLE */
h2{
  font-size:20px;
  margin-bottom:8px;
}

/* TEXT */
p{
  font-size:13px;
  color:var(--muted);
  margin-bottom:20px;
}

/* OBJECT NAME */
.object-name{
  background:var(--input);
  padding:10px;
  border-radius:8px;
  margin-bottom:20px;
  font-size:14px;
}

/* BUTTONS */
.actions{
  display:flex;
  gap:10px;
}

.btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
}

.btn-cancel{
  background:var(--input);
  color:var(--text);
}

.btn-delete{
  background:var(--danger);
  color:#111;
}

.btn:hover{opacity:.9}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">💰 BudgetBee</div>

  <a href="{% url 'dashboard' %}" class="nav-link">Dashboard</a>
  <a href="{% url 'expense_list' %}" class="nav-link">Transactions</a>
  <a href="{% url 'budget_list' %}" class="nav-link">Budgets</a>
  <a href="{% url 'category_list' %}" class="nav-link">Categories</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="card">

    <div class="icon">⚠️</div>

    <h2>Confirm Delete</h2>

    <p>
      Are you sure you want to delete this {{ type }}?
      This action cannot be undone.
    </p>

    <div class="object-name">
      {{ object }}
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="actions">
        <a href="javascript:history.back()" class="btn btn-cancel">Cancel</a>
        <button type="submit" class="btn btn-delete">Delete</button>
      </div>

    </form>

  </div>

</div>

</body>
</html>
